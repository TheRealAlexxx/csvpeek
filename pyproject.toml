[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csvpeek"
version = "0.1.0"
description = "Instant CSV inspection in the terminal: shape, types, nulls, stats, sample rows"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "TheRealAlexxx"}]
keywords = ["csv", "tsv", "cli", "data", "inspection"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
csvpeek = "csvpeek.cli:main"

[tool.setuptools.packages.find]
include = ["csvpeek*"]
